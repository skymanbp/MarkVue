// ===== Sync Scroll =====
function toggleSync() {
    S.syncScroll = !S.syncScroll;
    updateSyncBtn();
    toast(S.syncScroll ? '🔗' : '🔓', S.syncScroll ? t('toast.syncOn') : t('toast.syncOff'));
}
function updateSyncBtn() { $('btn-sync').classList.toggle('active', S.syncScroll); }

// ===== Divider =====
function initDivider() {
    const div = $('divider'), main = $('main');
    const edPane = main.querySelector('.editor-pane'), pvPane = main.querySelector('.preview-pane');
    let drag = false;
    const apply = ratio => { edPane.style.flex = String(ratio); pvPane.style.flex = String(1 - ratio); };
    try { const r = parseFloat(mvStore.get('markvue-split')); if (r > 0.15 && r < 0.85) apply(r); } catch (e) {}
    div.addEventListener('pointerdown', e => {
        drag = true; div.classList.add('dragging'); div.setPointerCapture(e.pointerId);
        document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; e.preventDefault();
    });
    div.addEventListener('pointermove', e => {
        if (!drag) return;
        const rect = main.getBoundingClientRect();
        const sidebar = $('outline-sidebar').getBoundingClientRect().width;
        const ratio = Math.max(0.15, Math.min(0.85, (e.clientX - rect.left - sidebar) / (rect.width - sidebar)));
        apply(ratio);
        S.splitRatio = ratio;
    });
    const stop = () => {
        if (!drag) return;
        drag = false; div.classList.remove('dragging');
        document.body.style.cursor = ''; document.body.style.userSelect = '';
        try { if (S.splitRatio) mvStore.set('markvue-split', String(S.splitRatio)); } catch (e) {}
    };
    div.addEventListener('pointerup', stop);
    div.addEventListener('pointercancel', stop);
    div.addEventListener('dblclick', () => { apply(0.5); S.splitRatio = 0.5; try { mvStore.remove('markvue-split'); } catch (e) {} });
}

// ===== Drag & Drop =====
function initDragDrop() {
    let dc = 0;
    const o = $('drop-overlay');
    const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    document.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dc++; o.classList.add('active'); });
    document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; e.preventDefault(); dc--; if (dc <= 0) { dc = 0; o.classList.remove('active'); } });
    document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
    document.addEventListener('drop', e => {
        if (!hasFiles(e)) return;
        e.preventDefault(); dc = 0; o.classList.remove('active');
        const f = e.dataTransfer.files[0];
        if (f) loadDroppedFile(f);
    });
}

// Desktop app: page scripts never see a dropped file's path, so the Python side
// (markvue_app.enable_file_drop) sends it here; the file then stays linked for saving.
let dropWaiter = null;
window.mvDroppedPath = p => {
    if (dropWaiter) dropWaiter(p);
    else S.droppedPath = { p, at: Date.now() };
};
function waitDroppedPath(name) {
    const d = S.droppedPath;
    S.droppedPath = null;
    if (d && Date.now() - d.at < 5000 && d.p.split(/[\\/]/).pop() === name) return Promise.resolve(d.p);
    return new Promise(resolve => {
        const timer = setTimeout(() => { dropWaiter = null; resolve(null); }, 800);
        dropWaiter = p => { clearTimeout(timer); dropWaiter = null; resolve(p); };
    });
}

async function loadDroppedFile(file) {
    if (S.dirty && !confirm(t('confirm.openReplace', { name: file.name }))) return;
    const api = native();
    const fullPath = api && api.open_path ? await waitDroppedPath(file.name) : null;
    if (fullPath) {
        try {
            const r = await api.open_path(fullPath);
            if (r && !r.error) { setDocument(r.content, { filename: r.filename, path: r.path }); toast('📂', t('toast.opened', { name: r.filename })); return; }
        } catch (e) {}
    }
    loadFileObject(file);
}

// ===== File Operations =====
function hasExt(name) { return MD_EXT.includes('.' + name.split('.').pop().toLowerCase()); }

async function openFile() {
    if (S.dirty && !confirm(t('confirm.open'))) return;

    // 1) Native desktop app: real file dialog, file stays linked by path
    const api = native();
    if (api && api.open_file_dialog) {
        try {
            const r = await api.open_file_dialog();
            if (!r) return; // cancelled
            if (r.error) { toast('❌', t('toast.openFailed', { err: r.error }), true); return; }
            setDocument(r.content, { filename: r.filename, path: r.path });
            toast('📂', t('toast.opened', { name: r.filename }));
            return;
        } catch (e) { /* fall through to the web pickers */ }
    }

    // 2) File System Access API (Chrome/Edge 86+)
    if (window.showOpenFilePicker) {
        try {
            const [handle] = await window.showOpenFilePicker({
                types: [{ description: 'Markdown', accept: { 'text/markdown': MD_EXT } }],
                multiple: false,
            });
            const file = await handle.getFile();
            const content = await file.text();
            setDocument(content, { filename: file.name, handle });
            toast('📂', t('toast.opened', { name: file.name }));
            return;
        } catch (e) {
            if (e.name === 'AbortError') return; // user cancelled
        }
    }
    // 3) Classic file input
    const inp = $('file-input');
    inp.onchange = e => { const f = e.target.files[0]; if (f) loadFileObject(f); inp.value = ''; };
    inp.click();
}

function loadFileObject(file) {
    if (!hasExt(file.name) && !file.type.startsWith('text/')) { toast('⚠️', t('toast.unsupported', { name: file.name }), true); return; }
    const r = new FileReader();
    r.onload = e => {
        setDocument(e.target.result, { filename: file.name });
        toast('📂', t('toast.openedUnlinked', { name: file.name }));
    };
    r.onerror = () => toast('❌', t('toast.readFailed'), true);
    r.readAsText(file);
}

function newFile() {
    if (S.dirty && !confirm(t('confirm.new'))) return;
    setDocument('', { filename: 'Untitled' });
    $('editor').focus();
}

// ===== Save =====
async function saveFile() {
    const content = $('editor').value;
    const api = native();

    // 1) Native app with a linked path -> write directly
    if (api && api.save_file && S.filePath) {
        try {
            const r = await api.save_file(content, S.filePath);
            if (r && r.ok) { afterSave(content, r.filename, r.path); return; }
            if (r && r.error) toast('⚠️', t('toast.saveFailedAs', { err: r.error }), true);
            if (r === null) return; // save-as dialog cancelled
        } catch (e) {}
    }

    // 2) File System Access API handle -> write directly
    if (S.fileHandle) {
        try {
            const writable = await S.fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            afterSave(content, S.filename);
            return;
        } catch (e) {
            if (e.name === 'AbortError') return;
            toast('⚠️', t('toast.writeFailedAs'), true);
        }
    }

    // 3) Browser server mode -> POST back to the opened path
    if (S.filePath && !api) {
        try {
            const resp = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: S.filePath, content }),
            });
            if (resp.ok) { afterSave(content, S.filename, S.filePath); return; }
            const err = await resp.json().catch(() => ({}));
            toast('⚠️', t('toast.serverSaveFailed', { err: err.error || resp.status }), true);
        } catch (e) { toast('⚠️', t('toast.serverSaveFailedAs'), true); }
    }

    return saveFileAs();
}

async function saveFileAs() {
    const content = $('editor').value;
    const suggested = S.filename === 'Untitled' ? 'document.md' : S.filename;
    const api = native();

    if (api && api.save_file_as) {
        try {
            const r = await api.save_file_as(content, S.filePath || suggested);
            if (r === null) return;
            if (r && r.ok) { afterSave(content, r.filename, r.path); return; }
            if (r && r.error) { toast('❌', t('toast.saveFailed', { err: r.error }), true); return; }
        } catch (e) {}
    }

    if (window.showSaveFilePicker) {
        try {
            const handle = await window.showSaveFilePicker({
                suggestedName: suggested,
                types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }],
            });
            const writable = await handle.createWritable();
            await writable.write(content);
            await writable.close();
            S.fileHandle = handle; S.filePath = null;
            afterSave(content, handle.name);
            return;
        } catch (e) {
            if (e.name === 'AbortError') return;
        }
    }

    // Last resort: download
    exportMD();
}

function afterSave(content, filename, path) {
    S.savedContent = content;
    S.dirty = false;
    if (filename) S.filename = filename;
    if (path) { S.filePath = path; S.fileHandle = null; }
    updateFileUI();
    toast('💾', t('toast.saved', { name: S.filename }));
    if (S.filePath) render(); // relative images may now resolve
}

function markDirty() {
    const d = $('editor').value !== S.savedContent;
    if (d !== S.dirty) { S.dirty = d; updateFileUI(); }
}

function updateFileUI() {
    const label = S.dirty ? `● ${S.filename}` : S.filename;
    const title = `${label} — MarkVue`;
    document.title = title;
    const api = native();
    if (api && api.set_title) { try { api.set_title(title); } catch (e) {} }
    if (api && api.set_dirty) { try { api.set_dirty(S.dirty); } catch (e) {} }

    $('sb-file').textContent = label;
    $('sb-file').title = S.dirty ? t('sb.dirty') : '';
    const linked = !!(S.fileHandle || S.filePath);
    $('sb-dot').className = 'save-dot ' + (!linked ? 'no-file' : S.dirty ? 'dirty' : 'clean');
    $('sb-dot').title = !linked ? t('sb.unlinked') : S.dirty ? t('sb.dirty') : t('sb.clean');

    const badge = $('save-badge');
    badge.textContent = S.dirty ? '●' : '';
    badge.className = 'save-badge' + (S.dirty ? ' dirty' : '');

    const pathEl = $('sb-path');
    if (S.filePath) {
        pathEl.textContent = S.filePath; pathEl.title = S.filePath + ' — ' + t('sb.copyPath'); pathEl.style.display = '';
    } else if (S.fileHandle) {
        pathEl.textContent = t('sb.localFile'); pathEl.title = t('sb.localFileTip'); pathEl.style.display = '';
    } else {
        pathEl.style.display = 'none';
    }
}

function copyFilePath() {
    const p = S.filePath || S.filename;
    copyText(p, t('toast.pathCopied'));
}

// Warn before leaving the page with unsaved changes (browser mode).
window.addEventListener('beforeunload', e => {
    if (!S.dirty || native()) return;
    e.preventDefault(); e.returnValue = '';
});

function exportPDF() {

    if (!$('editor').value.trim()) { toast('⚠️', t('toast.nothingToExport')); return; }

// ===== Preview interactions (event delegation; inline handlers are stripped by the sanitizer) =====
function initPreviewInteractions() {
    for (const id of ['preview-body', 'slide-content']) {
        $(id).addEventListener('click', e => {
            const copy = e.target.closest('.copy-btn');
            if (copy) { copyCode(copy); return; }
            const cb = e.target.closest('.task-cb');
            if (cb) { if (id === 'slide-content') { e.preventDefault(); return; } toggleTask(cb); return; }
            const a = e.target.closest('a[href]');
            if (a) handleLinkClick(e, a, $(id));
        });
    }
}

function handleLinkClick(e, a, container) {
    const href = a.getAttribute('href') || '';
    e.preventDefault();
    if (href.startsWith('#')) {
        let id = href.slice(1);
        try { id = decodeURIComponent(id); } catch (x) {}
        const target = container.querySelector(`[id="${CSS.escape(id)}"]`) || container.querySelector(`[id="${CSS.escape(slugLike(id))}"]`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        else toast('ℹ️', t('toast.anchorMissing', { id }));
        return;
    }
    if (/^(https?:|mailto:)/i.test(href)) {
        const api = native();
        if (api && api.open_external) { try { api.open_external(href); return; } catch (x) {} }
        window.open(href, '_blank', 'noopener');
        return;
    }
    toast('ℹ️', t('toast.linkKind'));
}
function slugLike(tx) { return tx.toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').trim().replace(/\s+/g, '-'); }

// Toggle "- [ ]" / "- [x]" in the source for the n-th task item of the preview.
function toggleTask(cb) {
    const all = Array.from($('preview-body').querySelectorAll('.task-cb'));
    const n = all.indexOf(cb);
    const ed = $('editor'), lines = ed.value.split('\n');
    let seen = -1, inFence = false;
    for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        if (/^\s*(```|~~~)/.test(l)) { inFence = !inFence; continue; }
        if (inFence) continue;
        const m = /^(\s*(?:[-*+]|\d+[.)])\s+\[)([ xX])(\])/.exec(l);
        if (!m) continue;
        seen++;
        if (seen !== n) continue;
        const checked = m[2] !== ' ';
        lines[i] = m[1] + (checked ? ' ' : 'x') + l.slice(m[1].length + 1);
        setEditorValueSilently(lines.join('\n'));
        cb.checked = !checked;
        return;
    }
    // Could not map the checkbox to a source line (e.g. task syntax inside HTML): undo the click.
    cb.checked = !cb.checked;
    toast('ℹ️', t('toast.taskUnmapped'));
}

// ===== Copy =====
function copyText(text, okMsg) {
    const done = () => toast('📋', okMsg);
    const fail = () => toast('❌', t('toast.copyFailed'), true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text) ? done() : fail());
    } else { fallbackCopy(text) ? done() : fail(); }
}
function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    return ok;
}
function copyMD() { copyText($('editor').value, t('toast.mdCopied')); }
function copyHTML() {
    const body = $('preview-body').cloneNode(true);
    body.querySelectorAll('.copy-btn').forEach(b => b.remove());
    copyText(body.innerHTML, t('toast.htmlCopied'));
}
function copyCode(btn) {
    const code = btn.closest('pre').querySelector('code').textContent;
    const ok = () => { btn.textContent = t('code.copied'); btn.classList.add('copied'); setTimeout(() => { btn.textContent = t('code.copy'); btn.classList.remove('copied'); }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, () => { if (fallbackCopy(code)) ok(); });
    else if (fallbackCopy(code)) ok();
}

// ===== Dropdown =====
function toggleDD(id) { const d = $(id); const open = !d.classList.contains('open'); closeDD(); d.classList.toggle('open', open); }
function closeDD() { document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open')); }
document.addEventListener('click', e => { if (!e.target.closest('.dropdown')) closeDD(); });

// ===== Keyboard Shortcuts =====
function initKeyboard() {
    document.addEventListener('keydown', e => {
        const ck = e.ctrlKey || e.metaKey;
        const k = e.key.toLowerCase();
        const inCmd = !!e.target.closest('.cmd-overlay');
        const inFind = !!e.target.closest('.find-bar');

        if (e.key === 'Escape') {
            if ($('cmd-overlay').classList.contains('open')) { closeCmdPalette(); return; }
            if (document.querySelector('.dropdown.open')) { closeDD(); return; }
            if ($('find-bar').classList.contains('open')) { toggleFindBar(false); return; }
            if (S.zen) { toggleZen(); return; }
            return;
        }
        if (inFind && e.key === 'Enter') {
            e.preventDefault();
            if (e.target.id === 'replace-input') doReplace();
            else if (e.shiftKey) findPrev(); else findNext();
            return;
        }
        if (!ck || inCmd) return;

        if (k === 'o' && !e.shiftKey) { e.preventDefault(); openFile(); }
        else if (k === 'n' && !e.shiftKey) { e.preventDefault(); newFile(); }
        else if (k === 's' && !e.shiftKey) { e.preventDefault(); saveFile(); }
        else if (k === 's' && e.shiftKey) { e.preventDefault(); saveFileAs(); }
        else if (k === 'e' && !e.shiftKey) { e.preventDefault(); exportHTML(); }
        else if (k === 'p' && !e.shiftKey) { e.preventDefault(); exportPDF(); }
        else if (k === 'k' && !e.shiftKey) { e.preventDefault(); openCmdPalette(); }
        else if (k === 'f' && !e.shiftKey) { e.preventDefault(); toggleFindBar(true); }
        else if (k === 'h' && !e.shiftKey) { e.preventDefault(); toggleFindBar(true); $('replace-input').focus(); }
        else if (k === 'o' && e.shiftKey) { e.preventDefault(); toggleOutline(); }
        else if (e.key === '\\') { e.preventDefault(); setView(S.view === 'split' ? 'preview-only' : 'split'); }
    });
}

// ===== Helpers =====
function $(id) { return document.getElementById(id); }
function dl(content, name, mime) {
    const b = new Blob([content], { type: mime + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function toast(icon, msg, isError) {
    const wrap = $('toast-wrap');
    // Collapse identical consecutive toasts
    const last = wrap.lastElementChild;
    if (last && last.dataset.msg === msg && !last.classList.contains('out')) return;
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.dataset.msg = msg;
    el.innerHTML = `<span>${icon}</span><span>${esc(msg)}</span>`;
    wrap.appendChild(el);
    while (wrap.children.length > 4) wrap.firstElementChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 200); }, isError ? 4000 : 2500);
}
