<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2363b3ed'/><text x='50' y='68' text-anchor='middle' font-family='Georgia,serif' font-weight='800' font-size='54' fill='white'>Mv</text></svg>">
<script>
// Settings and the draft. Served by the app (or markvue.py), the page gets
// window.MV_STORE and writes changes back to a settings file via /api/store:
// the desktop window runs WebView2 in private mode, so localStorage would be
// lost on close. Opened straight from disk, the page uses localStorage.
window.mvStore = (function () {
    var s = window.MV_STORE;
    if (s && typeof s === 'object') {
        var chain = Promise.resolve();          // keep writes in order
        var put = function (key, value) {
            chain = chain.then(function () {
                return fetch('/api/store', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key, value: value }) });
            }).catch(function () {});
        };
        return {
            get: function (k) { return Object.prototype.hasOwnProperty.call(s, k) ? s[k] : null; },
            set: function (k, v) { v = String(v); if (s[k] === v) return; s[k] = v; put(k, v); },
            remove: function (k) { if (!(k in s)) return; delete s[k]; put(k, null); }
        };
    }
    return {
        get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
        remove: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
    };
})();
</script>
<script>
// Apply the saved / system theme before first paint (no flash of wrong theme).
(function () {
    var t = null;
    try { t = mvStore.get('markvue-theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
})();
</script>

<style>
/* =============================================
   MARKVUE — Editorial Developer Tool
   Design: Moody dark meets refined editorial
   ============================================= */

:root {
    --font-display: 'Playfair Display', 'Noto Sans SC', Georgia, serif;
    --font-body: 'DM Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'Fira Code', 'Cascadia Code', 'Consolas', 'Noto Sans SC', monospace;
    --radius: 10px;
    --radius-sm: 6px;
    --radius-xs: 4px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --duration: 0.18s;
}

[data-theme="dark"] {
    color-scheme: dark;
    /* Cool ink-navy surfaces, stepped by lightness only */
    --bg-base: #0a0d13;
    --bg-surface: #10141e;
    --bg-raised: #181d2a;
    --bg-overlay: #212739;
    --bg-editor: #0c0f16;
    --bg-preview: #0f131c;
    --bg-toolbar: rgba(16, 20, 30, 0.9);
    --bg-sidebar: #0d1018;
    --bg-hover: rgba(148, 170, 210, 0.07);
    --bg-active: rgba(148, 170, 210, 0.12);
    --bg-selection: rgba(108, 182, 240, 0.24);
    --border: rgba(148, 170, 210, 0.09);
    --border-strong: rgba(148, 170, 210, 0.17);
    --border-accent: rgba(108, 182, 240, 0.32);
    --text-primary: #cdd5df;
    --text-heading: #eef2f7;
    --text-secondary: #949eab;
    --text-muted: #6c7686;
    --accent: #6cb6f0;
    --accent-soft: rgba(108, 182, 240, 0.12);
    --accent2: #c4b5fd;
    --accent2-soft: rgba(196, 181, 253, 0.12);
    --accent3: #86efac;
    --success: #86efac;
    --warning: #fbbf24;
    --danger: #fca5a5;
    --code-bg: #141a26;
    --code-head-bg: #181f2d;
    --code-inline: #cdbdfd;
    --thead-bg: rgba(148, 170, 210, 0.07);
    --mark-bg: rgba(251, 191, 36, 0.24);
    --notice-bg: rgba(251, 191, 36, 0.10);
    --tip-bg: #232a3d;
    --tip-text: #e3e8ef;
    --tip-border: rgba(148, 170, 210, 0.2);
    --scrim: rgba(4, 6, 11, 0.62);
    --scrollbar: rgba(148, 170, 210, 0.16);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-md: 0 6px 20px -4px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.2);
    --shadow-lg: 0 24px 64px -12px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.25);
    --shadow-glow: 0 0 60px rgba(108,182,240,0.07);
    --gradient-divider: linear-gradient(180deg, transparent, var(--accent) 30%, var(--accent2) 70%, transparent);
    --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

[data-theme="light"] {
    color-scheme: light;
    /* Warm paper neutrals with ink-blue + violet accents */
    --bg-base: #f3f1ec;
    --bg-surface: #faf9f6;
    --bg-raised: #eeebe5;
    --bg-overlay: #e6e2da;
    --bg-editor: #fffefb;
    --bg-preview: #fdfcf9;
    --bg-toolbar: rgba(250, 249, 246, 0.9);
    --bg-sidebar: #f1eee8;
    --bg-hover: rgba(68, 52, 28, 0.05);
    --bg-active: rgba(68, 52, 28, 0.085);
    --bg-selection: rgba(33, 86, 209, 0.15);
    --border: rgba(68, 52, 28, 0.1);
    --border-strong: rgba(68, 52, 28, 0.17);
    --border-accent: rgba(33, 86, 209, 0.28);
    --text-primary: #2b2824;
    --text-heading: #1a1815;
    --text-secondary: #5c574f;
    --text-muted: #7f796f;
    --accent: #2156d1;
    --accent-soft: rgba(33, 86, 209, 0.09);
    --accent2: #6d3fd6;
    --accent2-soft: rgba(109, 63, 214, 0.09);
    --accent3: #047857;
    --success: #047857;
    --warning: #9a4806;
    --danger: #c42b2b;
    --code-bg: #f4f1eb;
    --code-head-bg: #ece8e0;
    --code-inline: #6533c9;
    --thead-bg: rgba(68, 52, 28, 0.045);
    --mark-bg: rgba(250, 204, 21, 0.38);
    --notice-bg: rgba(217, 119, 6, 0.10);
    --tip-bg: #2b2824;
    --tip-text: #f7f5f0;
    --tip-border: transparent;
    --scrim: rgba(43, 36, 26, 0.3);
    --scrollbar: rgba(68, 52, 28, 0.2);
    --shadow-sm: 0 1px 2px rgba(60,45,25,0.07);
    --shadow-md: 0 6px 20px -4px rgba(60,45,25,0.14), 0 0 0 1px rgba(60,45,25,0.03);
    --shadow-lg: 0 24px 64px -12px rgba(60,45,25,0.24), 0 0 0 1px rgba(60,45,25,0.04);
    --shadow-glow: 0 0 60px rgba(33,86,209,0.05);
    --gradient-divider: linear-gradient(180deg, transparent, var(--accent) 30%, var(--accent2) 70%, transparent);
    --noise: none;
}

/* ===== Reset ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body { height:100%; }
body {
    font-family: var(--font-body);
    background: var(--bg-base);
    color: var(--text-primary);
    overflow: hidden;
    transition: background 0.35s var(--ease), color 0.35s var(--ease);
    -webkit-font-smoothing: antialiased;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--noise);
    pointer-events: none;
    z-index: 99999;
}

button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: padding-box; }

::selection { background: var(--bg-selection); }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ===== App Shell ===== */
.app { display: flex; flex-direction: column; height: 100%; }

/* ===== Notice (library load failure) ===== */
.notice {
    display: none; align-items: center; gap: 10px;
    padding: 7px 16px; font-size: 12px;
    background: var(--notice-bg); color: var(--warning);
    border-bottom: 1px solid color-mix(in srgb, var(--warning) 30%, transparent);
}
.notice.show { display: flex; }
.notice button {
    margin-left: auto; padding: 3px 10px; font-size: 11px;
    border: 1px solid currentColor; background: none; border-radius: var(--radius-xs); cursor: pointer;
}

/* ===== Toolbar ===== */
.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    height: 48px;
    min-height: 48px;
    background: var(--bg-toolbar);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 100;
    user-select: none;
}

.toolbar-section { display: flex; align-items: center; gap: 2px; }
.toolbar-section.center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: 8px;
    cursor: default;
}

.logo-mark {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 7px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 13px; color: #fff;
    font-family: var(--font-display);
    letter-spacing: -0.5px;
    box-shadow: var(--shadow-sm);
}

.logo-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.02em;
    color: var(--text-heading);
}

.sep { width:1px; height:20px; background: var(--border-strong); margin: 0 6px; }

/* Buttons */
.tb {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; font: 500 12px var(--font-body);
    color: var(--text-secondary); background: none; border: none;
    border-radius: var(--radius-xs); cursor: pointer;
    transition: background var(--duration) var(--ease), color var(--duration) var(--ease);
    white-space: nowrap; position: relative;
    height: 30px;
}
.tb:hover { background: var(--bg-hover); color: var(--text-primary); }
.tb.active { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--border-accent); }
.tb:active:not(:disabled) { background: var(--bg-active); }
.tb:disabled { opacity: 0.45; cursor: not-allowed; }
.tb svg { width:15px; height:15px; flex-shrink:0; }
.tb-icon { padding: 6px; width: 30px; justify-content: center; }
.tb-lang { font: 700 11px var(--font-body); letter-spacing: 0.02em; }
.toolbar-section.center .tb-icon { height: 26px; width: 30px; }
.toolbar-section.center .tb.active { background: var(--bg-surface); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border-strong); }

/* Tooltip */
.tb[data-tip]::after {
    content: attr(data-tip);
    position: absolute; top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%) scale(0.92);
    padding: 4px 8px; font: 500 11px var(--font-body); white-space: nowrap;
    background: var(--tip-bg); color: var(--tip-text);
    border-radius: var(--radius-xs); border: 1px solid var(--tip-border);
    box-shadow: var(--shadow-md); letter-spacing: 0.01em;
    opacity: 0; pointer-events: none;
    transition: opacity 0.12s var(--ease), transform 0.12s var(--ease);
    transition-delay: 0s;
    z-index: 1000;
}
.tb[data-tip]:hover::after { opacity: 1; transform: translateX(-50%) scale(1); transition-delay: 0.35s; }
.toolbar-section:last-child .tb[data-tip]:nth-last-child(-n+2)::after { left: auto; right: 0; transform: translateX(0) scale(0.92); }
.toolbar-section:last-child .tb[data-tip]:nth-last-child(-n+2):hover::after { transform: translateX(0) scale(1); }

/* Dropdown */
.dropdown { position: relative; }
.dd-menu {
    position: absolute; top: calc(100% + 4px); left: 0;
    background: var(--bg-surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius); padding: 4px;
    min-width: 200px; box-shadow: var(--shadow-lg);
    opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.97);
    transition: all 0.16s var(--ease); z-index: 200;
}
.dropdown.open .dd-menu { opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.dd-item {
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; font:13px var(--font-body);
    color: var(--text-secondary); border-radius: var(--radius-xs);
    cursor:pointer; border:none; background:none; width:100%; text-align:left;
    transition: background var(--duration) var(--ease), color var(--duration) var(--ease);
}
.dd-item:hover, .dd-item:focus-visible { background: var(--bg-hover); color: var(--text-primary); outline: none; }
.dd-item svg { width:14px; height:14px; opacity:0.6; flex-shrink:0; transition: opacity var(--duration) var(--ease); }
.dd-item:hover svg, .dd-item:focus-visible svg { opacity: 0.9; }
.dd-divider { height: 1px; background: var(--border); margin: 4px 0; }
.dd-item .shortcut { margin-left:auto; font:11px var(--font-mono); color:var(--text-muted); }

/* ===== Main Layout ===== */
.main-wrap { flex:1; display:flex; overflow:hidden; position:relative; min-height:0; }

/* Outline Sidebar */
.outline-sidebar {
    width: 0; overflow: hidden; flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    transition: width 0.25s var(--ease);
    display: flex; flex-direction: column;
}
.outline-sidebar.open { width: 240px; }

.outline-header {
    padding: 0 10px 0 16px; height: 34px; min-height: 34px;
    font: 600 10px var(--font-body);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    white-space: nowrap;
}

.outline-list {
    flex: 1; overflow-y: auto; padding: 8px;
    list-style: none;
}
.outline-empty { padding: 20px 12px; font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.6; }

.outline-item {
    display: block; width: 100%;
    padding: 5px 10px; margin: 1px 0;
    font-size: 12px; color: var(--text-secondary);
    background: none; border: none; border-radius: var(--radius-xs);
    cursor: pointer; text-align: left;
    transition: background var(--duration) var(--ease), color var(--duration) var(--ease);
    text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
    border-left: 2px solid transparent;
    font-family: var(--font-body);
}
.outline-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.outline-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); border-radius: 0 var(--radius-xs) var(--radius-xs) 0; }
.outline-item[data-level="1"] { font-weight: 600; }
.outline-item[data-level="2"] { padding-left: 22px; }
.outline-item[data-level="3"] { padding-left: 34px; font-size: 11px; }
.outline-item[data-level="4"] { padding-left: 46px; font-size: 11px; }

/* Editor / Preview Panes */
.pane {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0; position: relative;
}
.pane.editor-pane { background: var(--bg-editor); }
.pane.preview-pane { background: var(--bg-preview); }

.pane-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px 0 14px; height: 34px; min-height: 34px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
    user-select: none;
}

.pane-label {
    font: 600 10px var(--font-body);
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
}
.pane-label svg { width: 12px; height: 12px; }

.pane-actions { display:flex; align-items:center; gap:2px; }
.pane-btn {
    padding:3px 8px; font:500 11px var(--font-body);
    color:var(--text-secondary); background:none; border:none;
    border-radius:var(--radius-xs); cursor:pointer;
    transition: background var(--duration) var(--ease), color var(--duration) var(--ease);
    display:flex; align-items:center; gap:5px; height: 24px;
}
.pane-btn svg { width: 13px; height: 13px; }
.pane-btn:hover { background:var(--bg-hover); color:var(--text-primary); }
.pane-btn.active { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--border-accent); }

/* Formatting Toolbar */
.format-bar {
    display: flex; align-items: center; gap: 1px;
    padding: 0 10px; border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
    height: 32px; min-height: 32px; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; user-select: none;
}
.format-bar::-webkit-scrollbar { display: none; }

.fmt-btn {
    padding: 0 7px; background: none; border: none;
    color: var(--text-secondary); border-radius: var(--radius-xs);
    cursor: pointer; transition: background var(--duration) var(--ease), color var(--duration) var(--ease);
    font: 12px var(--font-mono); display: grid; place-items: center;
    min-width: 26px; height: 24px; flex-shrink: 0;
}
.fmt-btn svg { width: 14px; height: 14px; }
.fmt-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.fmt-btn:active { background: var(--bg-active); color: var(--accent); }
.fmt-sep { width:1px; height:16px; background:var(--border-strong); margin:0 4px; flex-shrink: 0; }

/* Editor textarea */
#editor {
    flex:1; width:100%; padding:20px 24px 50vh;
    font: 14px/1.75 var(--font-mono);
    font-variant-ligatures: none;
    color: var(--text-primary); background: transparent;
    border:none; outline:none; resize:none;
    tab-size:4; -moz-tab-size:4;
    overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    caret-color: var(--accent);
}
#editor::placeholder { color: var(--text-muted); }

/* Divider */
.divider {
    width: 6px; cursor: col-resize;
    flex-shrink: 0; position: relative; z-index: 10;
    background: transparent;
}
.divider::before {
    content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px;
    background: var(--gradient-divider); opacity: 0.5;
    transition: opacity 0.15s ease, width 0.15s ease, left 0.15s ease;
}
.divider:hover::before, .divider.dragging::before { opacity: 1; width: 4px; left: 1px; }

/* Preview */
#preview-scroll {
    flex:1; padding:28px 36px 40vh; overflow-y:auto; overflow-x:hidden;
}
#preview-body { max-width: 920px; margin: 0 auto; }

/* ===== Status Bar ===== */
.statusbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; height:24px; min-height:24px;
    background:var(--bg-surface); border-top:1px solid var(--border);
    font:11px var(--font-mono); color:var(--text-muted);
    user-select: none; gap: 12px;
}
.sb-group { display:flex; align-items:center; gap:14px; min-width: 0; }
.sb-item { display:flex; align-items:center; gap:4px; white-space: nowrap; }
.sb-saved { color:var(--success); }
.sb-item.sb-btn { cursor: pointer; border-radius: 3px; padding: 0 4px; margin: 0 -4px; }
.sb-item.sb-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

/* ===== Markdown Body ===== */
.md-body {
    font: 15px/1.8 var(--font-body);
    color: var(--text-primary);
    word-wrap: break-word;
}
.md-body > :first-child { margin-top: 0; }
.md-body h1,.md-body h2,.md-body h3,.md-body h4,.md-body h5,.md-body h6 {
    font-family: var(--font-display);
    font-weight: 700; line-height:1.3;
    margin:1.9em 0 0.7em; color: var(--text-heading);
    letter-spacing:-0.02em;
    scroll-margin-top: 20px;
}
.md-body h1 { font-size:2.1em; line-height:1.2; letter-spacing:-0.025em; padding-bottom:12px; border-bottom:1px solid var(--border-strong); }
.md-body h2 { font-size:1.6em; padding-bottom:8px; border-bottom:1px solid var(--border); }
.md-body h3 { font-size:1.3em; }
.md-body h4 { font-size:1.08em; font-family:var(--font-body); font-weight:600; letter-spacing:0; }
.md-body h5, .md-body h6 { font-size:0.8em; font-family:var(--font-body); font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-secondary); }
.md-body h1 + h2, .md-body h2 + h3, .md-body h3 + h4 { margin-top: 0.9em; }
.md-body p { margin-bottom:16px; }
.md-body a {
    color:var(--accent); cursor: pointer;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: var(--border-accent);
    transition: text-decoration-color var(--duration) var(--ease);
}
.md-body a:hover { text-decoration-color: currentColor; }
.md-body strong { font-weight:600; color:var(--text-heading); }
.md-body blockquote {
    margin:0 0 16px; padding:10px 20px;
    border-left:3px solid var(--accent);
    background:var(--accent-soft);
    background:linear-gradient(90deg, var(--accent-soft), color-mix(in srgb, var(--accent2-soft) 50%, transparent));
    border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    color:var(--text-secondary);
}
.md-body blockquote p:last-child { margin-bottom:0; }
.md-body code {
    font:0.88em var(--font-mono);
    padding:1px 6px; background:var(--code-bg);
    border:1px solid var(--border); border-radius:var(--radius-xs); color:var(--code-inline);
}
.md-body pre {
    margin:0 0 16px; background:var(--code-bg);
    border-radius:var(--radius); border:1px solid var(--border);
    overflow:hidden; position:relative;
}
.md-body pre code {
    display:block; padding:18px 20px;
    background:transparent; color:var(--text-primary);
    font-size:13px; line-height:1.65; overflow-x:auto;
    border:none; border-radius:0; white-space: pre;
}
.code-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:5px 8px 5px 14px; background:var(--code-head-bg);
    border-bottom:1px solid var(--border);
    font:500 11px var(--font-mono); color:var(--text-muted);
    letter-spacing:0.04em; text-transform:lowercase;
    user-select: none;
}
.copy-btn {
    padding:2px 8px; font:500 11px var(--font-body);
    color:var(--text-muted); background:transparent;
    border:1px solid transparent; border-radius:var(--radius-xs);
    cursor:pointer; transition: all var(--duration) var(--ease);
}
.md-body pre:hover .copy-btn { border-color: var(--border); color: var(--text-secondary); }
.copy-btn:hover, .md-body pre:hover .copy-btn:hover { background:var(--bg-hover); border-color:var(--border-strong); color:var(--text-primary); }
.copy-btn.copied, .md-body pre:hover .copy-btn.copied { color:var(--success); border-color:color-mix(in srgb, var(--success) 45%, transparent); background:transparent; }

.md-body ul,.md-body ol { padding-left:24px; margin-bottom:16px; }
.md-body li { margin-bottom:4px; }
.md-body li > ul, .md-body li > ol { margin-bottom: 0; margin-top: 4px; }
.md-body li:has(> .task-cb), .md-body li:has(> p > .task-cb) { list-style:none; margin-left:-20px; }
.md-body .task-cb { margin-right:6px; accent-color:var(--accent); cursor:pointer; vertical-align: -1px; }
.md-body .table-wrap { overflow-x: auto; margin: 0 0 16px; border:1px solid var(--border); border-radius:var(--radius); }
.md-body table { width:100%; border-collapse:collapse; margin: 0; }
.md-body .table-wrap table { border: none; }
.md-body thead tr { background:var(--thead-bg); }
.md-body th,.md-body td { padding:9px 14px; border:1px solid var(--border); text-align:left; font-size:13px; }
.md-body .table-wrap tr > :first-child { border-left: none; }
.md-body .table-wrap tr > :last-child { border-right: none; }
.md-body .table-wrap thead th { border-top: none; }
.md-body .table-wrap tbody tr:last-child > * { border-bottom: none; }
.md-body th { font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.06em; font-size:11px; border-bottom-color:var(--border-strong); }
.md-body tbody tr:hover { background:var(--bg-hover); }
.md-body hr { border:none; height:1px; margin:32px 0; background:var(--border-strong);
    background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--text-muted) 45%, transparent) 15%, color-mix(in srgb, var(--text-muted) 45%, transparent) 85%, transparent); }
.md-body img { max-width:100%; border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow-sm); }
.md-body img.broken { padding: 8px 12px; font-size: 12px; color: var(--danger); }
.md-body del { color:var(--text-muted); }
.md-body mark { background:var(--mark-bg); color: inherit; padding:1px 4px; border-radius:3px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
.md-body kbd {
    display:inline-block; padding:1px 6px; font:0.85em var(--font-mono);
    background:var(--bg-raised); color:var(--text-heading); border:1px solid var(--border-strong);
    border-bottom-width:2px; border-radius:var(--radius-xs);
    box-shadow: inset 0 -1px 0 var(--border);
}
.md-body .footnotes { font-size: 0.9em; color: var(--text-secondary); }
.md-body .mermaid { text-align:center; margin:0 0 16px; padding:20px; background:var(--bg-surface); border-radius:var(--radius); border:1px solid var(--border); overflow-x:auto; }
.md-body .mermaid svg { max-width: 100%; height: auto; }
.md-body .mermaid.pending { color: var(--text-muted); font: 12px var(--font-mono); white-space: pre-wrap; text-align:left; }
.md-body .mermaid-error { color: var(--danger); font: 12px var(--font-mono); white-space: pre-wrap; text-align: left; }
.md-body .math-block { margin:0 0 16px; padding:16px; background:var(--bg-surface); border-radius:var(--radius); border:1px solid var(--border); overflow-x:auto; overflow-y:hidden; }
.md-body .math-block .katex-display { margin: 0; }
.md-body .katex { font-size: 1.05em; }
.md-body .math-error { color: var(--danger); font-family: var(--font-mono); font-size: 0.9em; }

/* ===== View Modes ===== */
.main-wrap.editor-only .preview-pane,
.main-wrap.editor-only .divider { display:none; }
.main-wrap.preview-only .editor-pane,
.main-wrap.preview-only .divider { display:none; }
.main-wrap.editor-only .editor-pane,
.main-wrap.preview-only .preview-pane { flex: 1 1 auto !important; }

/* ===== Welcome ===== */
.welcome {
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:60vh; padding:40px; text-align:center;
    animation: fadeIn 0.4s var(--ease);
}
.welcome-big { font:800 44px var(--font-display); color:var(--text-heading); margin-bottom:8px; letter-spacing:-0.03em;
    background: linear-gradient(135deg, var(--text-heading) 30%, var(--accent) 75%, var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.welcome-sub { color:var(--text-secondary); font-size:14px; line-height:1.7; max-width:360px; margin-bottom:28px; }
.welcome-keys { display:grid; grid-template-columns: auto auto; gap: 8px 18px; font-size: 12px; color: var(--text-secondary); text-align:left; align-items:center; }
.welcome-keys span:nth-child(odd) { text-align: right; }
.welcome kbd, .cmd-footer kbd {
    display:inline-block; padding:2px 7px;
    font:11px var(--font-mono); background:var(--bg-raised);
    border:1px solid var(--border-strong); border-bottom-width:2px; border-radius:var(--radius-xs);
    color:var(--text-secondary);
}
.welcome-actions { display:flex; gap:8px; margin-top: 24px; }
.welcome-actions .tb { border: 1px solid var(--border-strong); background: var(--bg-surface); padding: 0 14px; box-shadow: var(--shadow-sm); }
.welcome-actions .tb:hover { border-color: var(--border-accent); color: var(--accent); background: var(--accent-soft); }

/* ===== Command Palette ===== */
.cmd-overlay {
    position:fixed; inset:0; background:var(--scrim);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:9000;
    display:flex; align-items:flex-start; justify-content:center;
    padding-top:16vh;
    opacity:0; visibility:hidden; transition:all 0.18s var(--ease);
}
.cmd-overlay.open { opacity:1; visibility:visible; }

.cmd-box {
    width:min(560px, calc(100vw - 32px)); background:var(--bg-surface);
    border:1px solid var(--border-strong);
    border-radius:12px; box-shadow:var(--shadow-lg);
    overflow:hidden;
    transform:translateY(-12px) scale(0.97);
    transition:all 0.18s var(--ease);
}
.cmd-overlay.open .cmd-box { transform:translateY(0) scale(1); }

.cmd-input-wrap {
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; border-bottom:1px solid var(--border);
}
.cmd-input-wrap svg { width:18px; height:18px; color:var(--text-muted); flex-shrink:0; }
#cmd-input {
    flex:1; font:14px var(--font-body);
    color:var(--text-primary); background:none; border:none; outline:none;
}
#cmd-input::placeholder { color:var(--text-muted); }

.cmd-list { max-height:min(360px, 50vh); overflow-y:auto; padding:4px; }
.cmd-empty { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }

.cmd-item {
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:var(--radius-sm);
    cursor:pointer; transition:background 0.08s var(--ease);
    font-size:13px; color:var(--text-secondary);
}
.cmd-item .cmd-ico { width: 20px; text-align: center; flex-shrink: 0; }
.cmd-item .cmd-en { color: var(--text-muted); font-size: 11px; margin-left: 2px; }
.cmd-item:hover { background:var(--bg-hover); color:var(--text-primary); }
.cmd-item.selected { background:var(--accent-soft); color:var(--text-heading); box-shadow: inset 2px 0 0 var(--accent); }
.cmd-item.selected .cmd-shortcut { color: var(--text-secondary); }
.cmd-item .cmd-shortcut { margin-left:auto; font:11px var(--font-mono); color:var(--text-muted); }

.cmd-footer {
    padding:8px 16px; border-top:1px solid var(--border);
    font:11px var(--font-body); color:var(--text-muted);
    background: var(--bg-raised);
    display:flex; align-items:center; gap:14px;
}

/* ===== Slide / Presentation Mode ===== */
.slide-overlay {
    position:fixed; inset:0; background:var(--bg-base);
    z-index:8000; display:flex; flex-direction:column;
    opacity:0; visibility:hidden; transition:all 0.3s var(--ease);
}
.slide-overlay.open { opacity:1; visibility:visible; }

.slide-toolbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px; background:var(--bg-surface);
    border-bottom:1px solid var(--border); flex-shrink:0;
}
.slide-info { font:13px var(--font-body); color:var(--text-secondary); display:flex; gap:14px; align-items:center; }
.slide-counter { font:600 13px var(--font-mono); color:var(--accent); }
.slide-hint { color: var(--text-muted); font-size: 11px; }

.slide-viewport {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:32px; overflow:hidden; min-height: 0;
}

.slide-card {
    width:100%; max-width:960px; max-height: 100%;
    background:var(--bg-surface); border:1px solid var(--border);
    border-radius:16px; padding:56px 72px;
    box-shadow:var(--shadow-lg), var(--shadow-glow);
    min-height:min(460px, 100%);
    display:flex; flex-direction:column; justify-content:center;
    animation:slideIn 0.35s var(--ease-spring);
    overflow-y: auto;
}

@keyframes slideIn {
    from { opacity:0; transform:translateX(30px); }
    to { opacity:1; transform:translateX(0); }
}
@keyframes slideInBack {
    from { opacity:0; transform:translateX(-30px); }
    to { opacity:1; transform:translateX(0); }
}

.slide-card .md-body h1 { font-size:2.6em; border:none; margin-top:0; }
.slide-card .md-body h2 { font-size:2em; border:none; margin-top:0; }
.slide-card .md-body { font-size:18px; }

.slide-nav {
    display:flex; align-items:center; justify-content:center;
    gap:16px; padding:14px; flex-shrink:0;
}

.slide-nav-btn {
    padding:9px 22px; font:500 13px var(--font-body);
    color:var(--text-secondary); background:var(--bg-surface);
    border:1px solid var(--border-strong); border-radius:var(--radius);
    cursor:pointer; transition:all var(--duration) var(--ease);
}
.slide-nav-btn:hover:not(:disabled) { background:var(--accent-soft); border-color:var(--border-accent); color:var(--accent); }
.slide-nav-btn:disabled { opacity: 0.4; cursor: default; }

.slide-dots { display:flex; align-items:center; gap:6px; flex-wrap: wrap; justify-content: center; max-width: 50vw; }
.slide-dot {
    width:8px; height:8px; border-radius:50%;
    background:var(--text-muted); border:none; cursor:pointer;
    transition:all var(--duration) var(--ease); padding:0;
}
.slide-dot { opacity: 0.55; }
.slide-dot:hover { opacity: 1; }
.slide-dot.active { background:var(--accent); transform:scale(1.3); opacity: 1; }
.slide-progress { height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s var(--ease); flex-shrink: 0; }

/* ===== Find & Replace ===== */
.find-bar {
    display:none; align-items:center; gap:6px; flex-wrap: wrap;
    padding:6px 10px; background:var(--bg-surface);
    border-bottom:1px solid var(--border);
}
.find-bar.open { display:flex; }

.find-input {
    padding:4px 10px; font:13px var(--font-mono);
    color:var(--text-primary); background:var(--bg-raised);
    border:1px solid var(--border); border-radius:var(--radius-xs);
    outline:none; height: 26px; flex: 1 1 140px; min-width: 110px; max-width: 260px;
    transition: border-color var(--duration) var(--ease);
}
.find-input:focus { border-color:var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.find-input::placeholder { color: var(--text-muted); }

.find-count { font:11px var(--font-mono); color:var(--text-muted); min-width:64px; }
.find-count.none { color: var(--danger); }

.find-btn {
    padding:4px 8px; font:12px var(--font-body);
    color:var(--text-secondary); background:none; border:none;
    border-radius:var(--radius-xs); cursor:pointer; height: 26px;
    transition: background var(--duration) var(--ease), color var(--duration) var(--ease);
}
.find-btn:hover { background:var(--bg-hover); color:var(--text-primary); }
.find-btn.toggle { font-family: var(--font-mono); font-size: 11px; border: 1px solid transparent; }
.find-btn.toggle.active { color: var(--accent); background: var(--accent-soft); border-color: var(--border-accent); }

/* ===== Zen Mode ===== */
.zen-mode .toolbar,
.zen-mode .statusbar,
.zen-mode .outline-sidebar,
.zen-mode .pane-head,
.zen-mode .format-bar,
.zen-mode .find-bar,
.zen-mode .divider,
.zen-mode .notice,
.zen-mode .preview-pane { display:none !important; }

.zen-mode .editor-pane { max-width:760px; margin:0 auto; flex: 1 1 auto !important; }
.zen-mode #editor { padding:60px 40px 50vh; font-size:16px; line-height:2; }
.zen-exit {
    display: none; position: fixed; top: 14px; right: 16px; z-index: 500;
    font: 11px var(--font-mono); color: var(--text-muted); opacity: 0.6;
}
.zen-mode .zen-exit { display: block; }

/* ===== Drag & Drop Overlay ===== */
.drop-overlay {
    position:fixed; inset:0; background:var(--scrim);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; align-items:center;
    justify-content:center; z-index:9999;
    opacity:0; visibility:hidden; transition:all 0.2s;
}
.drop-overlay.active { opacity:1; visibility:visible; }
.drop-box {
    padding:48px 56px; background:var(--bg-surface);
    border:2px dashed var(--accent); border-radius:20px;
    text-align:center; transform:scale(0.92);
    transition:transform 0.3s var(--ease-spring);
    pointer-events: none;
}
.drop-overlay.active .drop-box { transform:scale(1); }
.drop-title { font:700 20px var(--font-display); color:var(--text-heading); margin:12px 0 6px; }
.drop-sub { font:14px var(--font-body); color:var(--text-secondary); }

/* ===== Toast ===== */
.toast-wrap {
    position:fixed; bottom:36px; right:20px; z-index:10000;
    display:flex; flex-direction:column; gap:6px; pointer-events: none;
}
.toast {
    display:flex; align-items:center; gap:8px;
    padding:10px 16px; background:var(--bg-surface);
    border:1px solid var(--border-strong); border-radius:var(--radius);
    box-shadow:var(--shadow-md); font-size:12px; color:var(--text-primary);
    animation:toastIn 0.25s var(--ease) forwards; max-width: 360px;
}
.toast.out { animation:toastOut 0.2s var(--ease) forwards; }
.toast.error { border-color: color-mix(in srgb, var(--danger) 55%, transparent); box-shadow: var(--shadow-md), inset 3px 0 0 var(--danger); }
@keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes toastOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(8px)} }

/* ===== Animations ===== */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.app { animation:fadeIn 0.3s var(--ease); }

/* ===== Save Indicator ===== */
.save-dot {
    width:8px; height:8px; border-radius:50%;
    display:inline-block; margin-right:2px; flex-shrink:0;
    transition: background 0.3s var(--ease);
}
.save-dot.clean { background:var(--success); }
.save-dot.dirty { background:var(--warning); }
.save-dot.no-file { background:var(--text-muted); }

.tb .save-badge { font:700 11px var(--font-mono); line-height: 1; }
.tb .save-badge.dirty { color:var(--warning); }

.sb-filepath {
    max-width:min(360px, 30vw); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; display: block;
    opacity:0.7;
}
.sb-filepath:hover { opacity:1; }

/* ===== Hidden ===== */
#file-input { display:none; }

/* ===== Responsive ===== */
@media (max-width: 900px) {
    .tb .tb-label { display: none; }
    .tb { padding: 6px; }
}
@media (max-width: 768px) {
    .logo-name { display:none; }
    .format-bar { flex-wrap: wrap; height: auto; min-height: 32px; padding: 2px 10px; }
    #preview-scroll { padding:20px 16px 40vh; }
    .slide-card { padding:32px 24px; }
    .outline-sidebar.open { width:180px; }
    .sb-stats .sb-item:nth-child(n+3) { display: none; }
}

/* ===== Print (Export PDF) ===== */
@media print {
    @page { margin: 18mm 16mm; }
    html, body { height: auto !important; overflow: visible !important; background: #fff !important; color: #1f2937 !important; }
    body::after, .toolbar, .statusbar, .notice, .outline-sidebar, .editor-pane, .divider, .pane-head,
    .format-bar, .find-bar, .toast-wrap, .cmd-overlay, .slide-overlay, .drop-overlay, .zen-exit, .welcome { display: none !important; }
    .app, .main-wrap, .preview-pane, #preview-scroll { display: block !important; height: auto !important; overflow: visible !important; padding: 0 !important; background: #fff !important; }
    .md-body { color: #1f2937 !important; font-size: 12pt; max-width: none; }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body strong { color: #111 !important; }
    .md-body h1, .md-body h2, .md-body h3 { break-after: avoid; }
    .md-body pre, .md-body .mermaid, .md-body .math-block, .md-body .table-wrap, .md-body img { break-inside: avoid; }
    .md-body pre, .md-body code { background: #f3f4f6 !important; color: #1f2937 !important; border-color: #e5e7eb !important; }
    .md-body pre code { white-space: pre-wrap !important; }
    .md-body .code-head { background: #e5e7eb !important; color: #4b5563 !important; }
    .copy-btn { display: none !important; }
    .md-body a { color: #2563eb !important; }
    .md-body blockquote { background: #eff6ff !important; color: #374151 !important; }
    .md-body th, .md-body td { border-color: #e5e7eb !important; }
    .md-body thead tr { background: #f9fafb !important; }
}
</style>
</head>

<!-- ===== Toolbar ===== -->
<div class="toolbar">
  <div class="toolbar-section">
    <div class="logo" title="MarkVue">

      <span class="logo-name">MarkVue</span>
    </div>
    <div class="sep"></div>
    <button class="tb" onclick="newFile()" data-i18n-tip="tip.new">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      <span class="tb-label" data-i18n="btn.new"></span>

// ===== Markdown engine =====
let MD = null;               // marked.Marked instance
const slugCounts = new Map();

function slugify(text) {
    let s = text.toLowerCase()
        .replace(/<[^>]+>/g, '')
        .replace(/[^\p{L}\p{N}\s_-]/gu, '')
        .trim()
        .replace(/\s+/g, '-');
    if (!s) s = 'section';
    const n = slugCounts.get(s) || 0;
    slugCounts.set(s, n + 1);
    return n ? `${s}-${n}` : s;
}

function renderMath(tex, display) {
    if (typeof katex === 'undefined') return `<code class="math-error">${esc(tex)}</code>`;
    try {
        return katex.renderToString(tex, { displayMode: display, throwOnError: false, output: 'html', strict: 'ignore' });
    } catch (e) {
        return `<span class="math-error">${esc(tex)}</span>`;
    }
}

function initMarked() {
    if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') return false;

    const mathBlock = {
        name: 'mathBlock', level: 'block',
        start(src) { const i = src.indexOf('$$'); return i < 0 ? undefined : i; },
        tokenizer(src) {
            const m = /^\$\$\n?([\s\S]+?)\n?\$\$(?:[ \t]*\n|$)/.exec(src);
            if (m) return { type: 'mathBlock', raw: m[0], text: m[1].trim() };
        },
        renderer(tok) { return `<div class="math-block">${renderMath(tok.text, true)}</div>\n`; },
    };
    const mathInline = {
        name: 'mathInline', level: 'inline',
        start(src) { const i = src.indexOf('$'); return i < 0 ? undefined : i; },
        tokenizer(src) {
            // $$...$$ on one line -> display math; $...$ with no space right after the opening
            // or before the closing $ (so "$5 and $6" stays text) -> inline math
            let m = /^\$\$([^\n]+?)\$\$/.exec(src);
            if (m) return { type: 'mathInline', raw: m[0], text: m[1].trim(), display: true };
            m = /^\$(?!\s)((?:\\\$|[^$\n])+?)(?<!\s)\$(?!\d)/.exec(src);
            if (m) return { type: 'mathInline', raw: m[0], text: m[1].replace(/\\\$/g, '$') };
        },
        renderer(tok) { return tok.display ? `<div class="math-block">${renderMath(tok.text, true)}</div>` : renderMath(tok.text, false); },
    };

    const renderer = {
        code({ text, lang }) {
            const l = (lang || '').trim().split(/\s+/)[0].toLowerCase();
            if (l === 'mermaid') return `<div class="mermaid pending">${esc(text)}</div>\n`;
            let html, cls = l || 'text';
            if (typeof hljs !== 'undefined') {
                if (l && hljs.getLanguage(l)) html = hljs.highlight(text, { language: l, ignoreIllegals: true }).value;
                else if (!l && text.length < 20000) { const r = hljs.highlightAuto(text); html = r.value; cls = r.language || 'text'; }
                else html = esc(text);
            } else html = esc(text);
            return `<pre><div class="code-head"><span class="code-lang">${esc(cls)}</span><button type="button" class="copy-btn">${esc(t('code.copy'))}</button></div><code class="hljs language-${esc(cls)}">${html}</code></pre>\n`;
        },
        heading({ tokens, depth }) {
            const inner = this.parser.parseInline(tokens);
            const id = slugify(inner.replace(/<[^>]+>/g, ''));
            return `<h${depth} id="${id}">${inner}</h${depth}>\n`;
        },
        checkbox({ checked }) {
            return `<input type="checkbox" class="task-cb"${checked ? ' checked' : ''}>`;
        },
        table(token) {
            // Delegate to the default renderer, then wrap for horizontal scrolling.
            const html = marked.Renderer.prototype.table.call(this, token);
            return `<div class="table-wrap">${html}</div>`;
        },
    };

    MD = new marked.Marked({ gfm: true, breaks: true, renderer, extensions: [mathBlock, mathInline] });
    return true;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function initMermaid() {
    if (typeof mermaid === 'undefined') return;
    const th = document.documentElement.getAttribute('data-theme');
    try {
        mermaid.initialize({ startOnLoad: false, theme: th === 'dark' ? 'dark' : 'default', securityLevel: 'strict', fontFamily: 'DM Sans, Noto Sans SC, sans-serif' });
    } catch (e) {}
}

// Convert Markdown to sanitized HTML (synchronous).
function markdownToHTML(src) {
    if (!MD) return `<pre style="white-space:pre-wrap">${esc(src)}</pre>`;
    slugCounts.clear();
    let html;
    try { html = MD.parse(src); }
    catch (e) { html = `<pre class="mermaid-error">${esc(t('render.error'))}:\n${esc(e.message || e)}</pre><pre style="white-space:pre-wrap">${esc(src)}</pre>`; }
    return DOMPurify.sanitize(html, {
        ADD_ATTR: ['checked'],
        FORBID_TAGS: ['style', 'form'],
    });
}

// Post-render: images next to the open file, mermaid diagrams.
const mermaidCache = new Map();
let mermaidSeq = 0;

async function postProcess(container, seq) {
    // Relative image paths resolve against the open document's folder (server / native mode).
    if (S.filePath) {
        container.querySelectorAll('img[src]').forEach(img => {
            const src = img.getAttribute('src');
            if (/^(?:[a-z][a-z0-9+.-]*:|\/\/|\/asset\/|#)/i.test(src)) return;
            img.setAttribute('src', '/asset/' + src.split('/').map(encodeURIComponent).join('/'));
        });
    }
    container.querySelectorAll('img').forEach(img => {
        img.addEventListener('error', () => { img.classList.add('broken'); img.alt = img.alt || t('img.broken'); }, { once: true });
    });

    // Mermaid (async, cached by source)
    const blocks = Array.from(container.querySelectorAll('.mermaid'));
    if (!blocks.length) return;
    if (typeof mermaid === 'undefined') {
        blocks.forEach(el => { el.classList.remove('pending'); el.classList.add('mermaid-error'); el.textContent = t('mermaid.missing') + '\n' + el.textContent; });
        return;
    }
    for (const el of blocks) {
        const src = el.textContent;
        const key = document.documentElement.getAttribute('data-theme') + '\n' + src;
        let svg = mermaidCache.get(key);
        if (!svg) {
            try {
                const id = 'mm-' + (++mermaidSeq);
                const r = await mermaid.render(id, src);
                svg = r.svg;
                mermaidCache.set(key, svg);
                if (mermaidCache.size > 200) mermaidCache.delete(mermaidCache.keys().next().value);
            } catch (e) {
                // mermaid leaves a stray element behind on failure
                document.querySelectorAll('[id^="dmm-"], svg[id^="mm-"]').forEach(n => { if (!container.contains(n)) n.remove(); });
                svg = null;
                if (seq !== undefined && seq !== S.renderSeq) return;
                el.classList.remove('pending');
                el.innerHTML = `<div class="mermaid-error">${esc(t('mermaid.error'))}\n${esc((e && e.message) || e)}</div>`;
                continue;
            }
        }
        if (seq !== undefined && seq !== S.renderSeq) return; // stale render
        el.classList.remove('pending');
        el.innerHTML = svg;
    }
}

function initEditor() {
    const ed = $('editor');
    ed.addEventListener('input', () => {
        clearTimeout(S.renderTimer);
        S.renderTimer = setTimeout(render, 120);
        scheduleAutoSave();
        markDirty();
    });
    ed.addEventListener('keydown', editorKeydown);
    ed.addEventListener('keyup', updateCursorPos);
    ed.addEventListener('click', updateCursorPos);
    ed.addEventListener('select', updateCursorPos);

    // Sync scroll (ratio based, debounced through a lock so the two panes don't fight)
    const p = $('preview-scroll');
    ed.addEventListener('scroll', () => syncFrom(ed, p));
    p.addEventListener('scroll', () => { syncFrom(p, ed); updateOutlineActive(); });
}

function syncFrom(src, dst) {
    if (!S.syncScroll || S.view !== 'split') return;
    if (S.scrollLock && S.scrollLock !== src) return;
    S.scrollLock = src;
    const ratio = src.scrollTop / Math.max(1, src.scrollHeight - src.clientHeight);
    dst.scrollTop = ratio * (dst.scrollHeight - dst.clientHeight);
    clearTimeout(S.scrollLockTimer);
    S.scrollLockTimer = setTimeout(() => S.scrollLock = 0, 60);
}

function editorKeydown(e) {
    const ed = e.target;
    const ck = e.ctrlKey || e.metaKey;

    if (e.key === 'Tab') {
        e.preventDefault();
        if (e.shiftKey) outdentSelection(); else indentSelection();
        return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !ck && !e.isComposing) {
        if (continueList(ed)) e.preventDefault();
        return;
    }
    if (!ck) return;
    const k = e.key.toLowerCase();
    if (k === 'b' && !e.shiftKey) { e.preventDefault(); fmt('**', '**'); }
    else if (k === 'i' && !e.shiftKey) { e.preventDefault(); fmt('*', '*'); }
    else if (e.key === '`') { e.preventDefault(); fmt('`', '`'); }
    else if (k === 'l' && e.shiftKey) { e.preventDefault(); insertLink(); }
    else if (/^[1-3]$/.test(e.key) && !e.shiftKey && !e.altKey) { e.preventDefault(); fmtHeading(+e.key); }
}

// --- Text manipulation that keeps the native undo stack where the browser allows it ---
function replaceRange(start, end, text, selStart, selEnd) {
    const ed = $('editor');
    const expected = ed.value.slice(0, start) + text + ed.value.slice(end);
    ed.focus();
    ed.setSelectionRange(start, end);
    try { document.execCommand(text === '' ? 'delete' : 'insertText', false, text); } catch (e) {}
    if (ed.value !== expected) {
        // execCommand unavailable (or refused): set the value directly, losing undo for this step only
        ed.value = expected;
        ed.dispatchEvent(new Event('input', { bubbles: true }));
    }
    const s = selStart === undefined ? start + text.length : selStart;
    ed.setSelectionRange(s, selEnd === undefined ? s : selEnd);
    updateCursorPos();
}

// Change the editor value without moving focus (used by preview-side interactions).
function setEditorValueSilently(newValue) {
    const ed = $('editor');
    const s = ed.selectionStart, e = ed.selectionEnd, top = ed.scrollTop;
    ed.value = newValue;
    ed.setSelectionRange(Math.min(s, newValue.length), Math.min(e, newValue.length));
    ed.scrollTop = top;
    ed.dispatchEvent(new Event('input', { bubbles: true }));
}

function lineBounds(value, pos) {
    const start = value.lastIndexOf('\n', pos - 1) + 1;
    let end = value.indexOf('\n', pos);
    if (end === -1) end = value.length;
    return { start, end };
}

function indentSelection() {
    const ed = $('editor'), v = ed.value, s = ed.selectionStart, e = ed.selectionEnd;
    if (s === e || !v.slice(s, e).includes('\n')) {
        replaceRange(s, e, '    ');
        return;
    }
    const a = lineBounds(v, s).start, b = lineBounds(v, e - 1).end;
    const block = v.slice(a, b);
    const out = block.split('\n').map(l => '    ' + l).join('\n');
    replaceRange(a, b, out, a, a + out.length);
}

function outdentSelection() {
    const ed = $('editor'), v = ed.value, s = ed.selectionStart, e = ed.selectionEnd;
    const a = lineBounds(v, s).start, b = lineBounds(v, Math.max(s, e - 1)).end;
    const block = v.slice(a, b);
    const out = block.split('\n').map(l => l.replace(/^(?: {1,4}|\t)/, '')).join('\n');
    if (out === block) return;
    replaceRange(a, b, out, a, a + out.length);
}

// Enter inside a list / quote continues it; Enter on an empty item ends the list.
function continueList(ed) {
    const v = ed.value, s = ed.selectionStart;
    if (s !== ed.selectionEnd) return false;
    const { start } = lineBounds(v, s);
    const line = v.slice(start, s);
    const m = /^(\s*)(?:([-*+])\s+(\[[ xX]\]\s+)?|(\d+)([.)])\s+|(>)\s?)/.exec(line);
    if (!m) return false;
    const indent = m[1];
    const rest = line.slice(m[0].length);
    if (!rest.trim()) {
        // empty item -> remove the marker and leave the list
        replaceRange(start, s, indent.length ? indent : '');
        return true;
    }
    let marker;
    if (m[2]) marker = `${m[2]} ${m[3] ? '[ ] ' : ''}`;
    else if (m[4]) marker = `${+m[4] + 1}${m[5]} `;
    else marker = '> ';
    replaceRange(s, s, '\n' + indent + marker);
    return true;
}

function updateCursorPos() {
    const ed = $('editor');
    const pos = ed.selectionStart;
    const before = ed.value.slice(0, pos);
    const line = (before.match(/\n/g) || []).length + 1;
    const col = pos - before.lastIndexOf('\n');
    const sel = ed.selectionEnd - ed.selectionStart;
    $('sb-pos').textContent = t('sb.pos', { line, col }) + (sel ? t('sb.sel', { n: sel }) : '');
}

// ===== Render =====
async function render() {
    const ed = $('editor'), content = ed.value;
    const welcome = $('welcome'), body = $('preview-body');
    const seq = ++S.renderSeq;

    updateStats(content);
    if (!content.trim()) {
        welcome.style.display = 'flex'; body.style.display = 'none';
        body.innerHTML = '';
        buildOutline();
        return;
    }
    welcome.style.display = 'none'; body.style.display = 'block';

    body.innerHTML = markdownToHTML(content);
    buildOutline();
    await postProcess(body, seq);
    if (seq === S.renderSeq) updateOutlineActive();
}

// ===== Stats =====
function updateStats(c) {
    const tx = c.trim();
    const cjk = (tx.match(/[一-鿿㐀-䶿぀-ヿ가-힯]/g) || []).length;
    const eng = tx ? tx.replace(/[一-鿿㐀-䶿぀-ヿ가-힯]/g, ' ').split(/\s+/).filter(Boolean).length : 0;
    const words = cjk + eng;
    const chars = Array.from(tx).length;
    const lines = c ? c.split('\n').length : 0;
    const mins = words ? Math.max(1, Math.ceil(words / 300)) : 0;
    $('sb-words').textContent = t('sb.words', { n: words });
    $('sb-chars').textContent = t('sb.chars', { n: chars });
    $('sb-lines').textContent = t('sb.lines', { n: lines });
    $('sb-read').textContent = t('sb.read', { n: mins });
}

// ===== Outline =====
function buildOutline() {
    const list = $('outline-list');
    list.innerHTML = '';
    const headings = $('preview-body').querySelectorAll('h1,h2,h3,h4');
    if (!headings.length) {
        list.innerHTML = `<li class="outline-empty">${t('outline.empty')}</li>`;
        return;
    }
    headings.forEach(h => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'outline-item';
        btn.dataset.level = h.tagName[1];
        btn.dataset.target = h.id;
        btn.textContent = h.textContent;
        btn.title = h.textContent;
        btn.onclick = () => {
            h.scrollIntoView({ behavior: 'smooth', block: 'start' });
            list.querySelectorAll('.outline-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };
        li.appendChild(btn);
        list.appendChild(li);
    });
}

function updateOutlineActive() {
    if (!S.outlineOpen) return;
    const p = $('preview-scroll');
    const headings = $('preview-body').querySelectorAll('h1,h2,h3,h4');
    if (!headings.length) return;
    const base = p.getBoundingClientRect().top;
    let current = headings[0];
    for (const h of headings) { if (h.getBoundingClientRect().top - base <= 60) current = h; else break; }
    const items = $('outline-list').querySelectorAll('.outline-item');
    items.forEach(b => {
        const on = b.dataset.target === current.id;
        b.classList.toggle('active', on);
        if (on) b.scrollIntoView({ block: 'nearest' });
    });
}

function toggleOutline() {
    S.outlineOpen = !S.outlineOpen;
    $('outline-sidebar').classList.toggle('open', S.outlineOpen);
    $('btn-outline').classList.toggle('active', S.outlineOpen);
    if (S.outlineOpen) updateOutlineActive();
}

// ===== Formatting Toolbar =====
function fmt(before, after) {
    const ed = $('editor');
    const s = ed.selectionStart, e = ed.selectionEnd, v = ed.value;
    const sel = v.substring(s, e);
    // Toggle off if the selection is already wrapped
    if (v.slice(s - before.length, s) === before && v.slice(e, e + after.length) === after) {
        replaceRange(s - before.length, e + after.length, sel, s - before.length, s - before.length + sel.length);
        return;
    }
    if (sel.startsWith(before) && sel.endsWith(after) && sel.length >= before.length + after.length) {
        const inner = sel.slice(before.length, sel.length - after.length);
        replaceRange(s, e, inner, s, s + inner.length);
        return;
    }
    const text = sel || t('fmt.placeholder');
    replaceRange(s, e, before + text + after, s + before.length, s + before.length + text.length);
}

function fmtLine(prefix) {
    const ed = $('editor'), v = ed.value;
    const s = ed.selectionStart, e = ed.selectionEnd;
    const a = lineBounds(v, s).start, b = lineBounds(v, Math.max(s, e - 1)).end;
    const lines = v.slice(a, b).split('\n');
    const allHave = lines.every(l => l.startsWith(prefix));
    const out = lines.map(l => allHave ? l.slice(prefix.length) : prefix + l).join('\n');
    replaceRange(a, b, out, a, a + out.length);
}

function fmtHeading(level) {
    const ed = $('editor'), v = ed.value, s = ed.selectionStart;
    const { start, end } = lineBounds(v, s);
    const line = v.slice(start, end);
    const m = /^(#{1,6})\s+/.exec(line);
    const body = m ? line.slice(m[0].length) : line;
    const out = (m && m[1].length === level) ? body : '#'.repeat(level) + ' ' + body;
    replaceRange(start, end, out, start + out.length, start + out.length);
}

function insertLink() { fmt('[', '](https://)'); }
function insertImage() { fmt('![', '](https://)'); }
function insertTable() {
    const c = t('tbl.col'), x = t('tbl.cell');
    insertText(`\n| ${c}1 | ${c}2 | ${c}3 |\n|------|------|------|\n| ${x} | ${x} | ${x} |\n`);
}
function insertCodeBlock() {
    const ed = $('editor'), s = ed.selectionStart, e = ed.selectionEnd;
    const sel = ed.value.slice(s, e);
    const text = '\n```\n' + (sel || '') + '\n```\n';
    replaceRange(s, e, text, s + 4, s + 4);
}
function insertMath() {
    const ed = $('editor'), s = ed.selectionStart, e = ed.selectionEnd;
    const sel = ed.value.slice(s, e);
    if (sel.includes('\n') || !sel) { const tx = '\n$$\n' + (sel || 'E = mc^2') + '\n$$\n'; replaceRange(s, e, tx, s + 4, s + tx.length - 4); }
    else fmt('$', '$');
}

function insertText(text) {
    const ed = $('editor'), s = ed.selectionStart;
    replaceRange(s, ed.selectionEnd, text);
}

// ===== Find & Replace =====
function toggleFindBar(force) {
    const bar = $('find-bar');
    const open = force === undefined ? !bar.classList.contains('open') : !!force;
    bar.classList.toggle('open', open);
    $('btn-find').classList.toggle('active', open);
    if (open) {
        const ed = $('editor');
        const sel = ed.value.slice(ed.selectionStart, ed.selectionEnd);
        if (sel && !sel.includes('\n')) $('find-input').value = sel;
        $('find-input').focus(); $('find-input').select();
        doFind();
    } else {
        $('editor').focus();
    }
}

function toggleFindOpt(which) {
    if (which === 'case') S.findCase = !S.findCase; else S.findRegex = !S.findRegex;
    $('find-case').classList.toggle('active', S.findCase);
    $('find-regex').classList.toggle('active', S.findRegex);
    doFind();
}

function buildFindRegex() {
    const q = $('find-input').value;
    if (!q) return null;
    const flags = 'g' + (S.findCase ? '' : 'i');
    try { return new RegExp(S.findRegex ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags); }
    catch (e) { return null; }
}

function doFind(keepIdx) {
    const ed = $('editor');
    const re = buildFindRegex();
    const prevStart = keepIdx && S.findMatches[S.findIdx] ? S.findMatches[S.findIdx].start : -1;
    S.findMatches = []; S.findIdx = -1;
    const cnt = $('find-count');
    if (!re) { cnt.textContent = $('find-input').value && S.findRegex ? t('find.badRegex') : ''; cnt.classList.toggle('none', !!$('find-input').value); return; }
    let m;
    while ((m = re.exec(ed.value)) !== null) {
        if (m[0].length === 0) { re.lastIndex++; continue; }
        S.findMatches.push({ start: m.index, end: m.index + m[0].length });
        if (S.findMatches.length > 5000) break;
    }
    cnt.classList.toggle('none', !S.findMatches.length);
    if (!S.findMatches.length) { cnt.textContent = t('find.none'); return; }
    // Start from the match at/after the caret
    const from = prevStart >= 0 ? prevStart : ed.selectionStart;
    let i = S.findMatches.findIndex(x => x.start >= from);
    if (i < 0) i = 0;
    S.findIdx = i - 1;
    findNext();
}

function findNext() {
    if (!S.findMatches.length) { if ($('find-input').value) doFind(); return; }
    S.findIdx = (S.findIdx + 1) % S.findMatches.length;
    highlightFind();
}

function findPrev() {
    if (!S.findMatches.length) return;
    S.findIdx = (S.findIdx - 1 + S.findMatches.length) % S.findMatches.length;
    highlightFind();
}

function highlightFind() {
    const ed = $('editor'), m = S.findMatches[S.findIdx];
    if (!m) return;
    ed.setSelectionRange(m.start, m.end);
    scrollEditorToSelection();
    $('find-count').textContent = `${S.findIdx + 1} / ${S.findMatches.length}`;
}

function scrollEditorToSelection() {
    const ed = $('editor');
    const lh = parseFloat(getComputedStyle(ed).lineHeight) || 24;
    const pad = parseFloat(getComputedStyle(ed).paddingTop) || 0;
    const line = ed.value.slice(0, ed.selectionStart).split('\n').length - 1;
    const y = pad + line * lh;
    if (y < ed.scrollTop + lh || y > ed.scrollTop + ed.clientHeight - lh * 2) {
        ed.scrollTop = Math.max(0, y - ed.clientHeight / 2);
    }
}

function doReplace() {
    if (S.findIdx < 0 || !S.findMatches.length) { doFind(); return; }
    const m = S.findMatches[S.findIdx];
    const r = $('replace-input').value;
    const ed = $('editor');
    let text = r;
    if (S.findRegex) { const re = buildFindRegex(); if (re) { re.lastIndex = 0; text = ed.value.slice(m.start, m.end).replace(new RegExp(re.source, re.flags.replace('g', '')), r); } }
    replaceRange(m.start, m.end, text);
    render();
    doFind(true);
}

function doReplaceAll() {
    const ed = $('editor'), re = buildFindRegex(), r = $('replace-input').value;
    if (!re) return;
    const count = S.findMatches.length;
    if (!count) { toast('ℹ️', t('find.nothing')); return; }
    const out = ed.value.replace(re, r);
    replaceRange(0, ed.value.length, out, 0, 0);
    render();
    doFind();
    toast('✅', t('find.replaced', { n: count }));
}

// ===== Paste Image =====
function initPasteImage() {
    $('editor').addEventListener('paste', e => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (const item of items) {
            if (item.type.startsWith('image/')) {
                e.preventDefault();
                const file = item.getAsFile();
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    insertText(`![image](${ev.target.result})\n`);
                    toast('🖼️', t('toast.imagePasted', { kb: Math.round(file.size / 1024) }));
                };
                reader.readAsDataURL(file);
                return;
            }
        }
    });
}

async function loadInitial() {
    // Server / native mode: file passed on the command line
    if (window.location.search.includes('file=1')) {
        try {
            const resp = await fetch('/api/initial-file');
            if (resp.ok && resp.status !== 204) {
                const data = await resp.json();
                setDocument(data.content, { filename: data.filename, path: data.path });
                toast('📂', t('toast.opened', { name: data.filename }));
                return;
            }
        } catch (e) {}
    }
    // Restore the last draft
    try {
        const saved = mvStore.get('markvue-content');
        const name = mvStore.get('markvue-filename');
        if (saved) {
            setDocument(saved, { filename: name || 'Untitled' });
            return;
        }
    } catch (e) {}
    setDocument(getSample(), { filename: 'Untitled' });
}

function loadSample() {
    if (S.dirty && !confirm(t('confirm.sample'))) return;
    setDocument(getSample(), { filename: 'Untitled' });
}

// Replace the editor content and (re)link the file. Resets the undo history on purpose.
function setDocument(content, { filename, path, handle } = {}) {
    const ed = $('editor');
    ed.value = content;
    S.filename = filename || 'Untitled';
    S.filePath = path || null;
    S.fileHandle = handle || null;
    S.savedContent = content;
    S.dirty = false;
    ed.scrollTop = 0; ed.setSelectionRange(0, 0);
    $('preview-scroll').scrollTop = 0;
    updateFileUI();
    updateCursorPos();
    render();
}

// ===== Slide / Presentation Mode =====
function enterSlideMode() {
    const content = $('editor').value;
    if (!content.trim()) { toast('⚠️', t('slide.empty')); return; }
    S.slides = content.split(/\n[ \t]*(?:---+|\*\*\*+)[ \t]*\n/).map(s => s.trim()).filter(Boolean);
    if (S.slides.length < 2) {
        const parts = content.split(/\n(?=#{1,2}\s)/).map(s => s.trim()).filter(Boolean);
        if (parts.length >= 2) S.slides = parts;
    }
    S.slideIdx = 0;
    renderSlide(0);
    $('slide-overlay').classList.add('open');
    document.addEventListener('keydown', slideKeyHandler, true);
}

function exitSlideMode() {
    $('slide-overlay').classList.remove('open');
    document.removeEventListener('keydown', slideKeyHandler, true);
}

function slideKeyHandler(e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'ArrowDown') { e.preventDefault(); slideNav(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp' || e.key === 'Backspace') { e.preventDefault(); slideNav(-1); }
    else if (e.key === 'Home') { e.preventDefault(); S.slideIdx = 0; renderSlide(-1); }
    else if (e.key === 'End') { e.preventDefault(); S.slideIdx = S.slides.length - 1; renderSlide(1); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); exitSlideMode(); }
}

function slideNav(dir) {
    const next = Math.max(0, Math.min(S.slides.length - 1, S.slideIdx + dir));
    if (next === S.slideIdx) return;
    S.slideIdx = next;
    renderSlide(dir);
}

async function renderSlide(dir) {
    const content = S.slides[S.slideIdx] || '';
    const el = $('slide-content');
    el.innerHTML = markdownToHTML(content);
    const n = S.slides.length;
    $('slide-counter').textContent = `${S.slideIdx + 1} / ${n}`;
    $('slide-progress').style.width = `${((S.slideIdx + 1) / n) * 100}%`;
    $('slide-prev').disabled = S.slideIdx === 0;
    $('slide-next').disabled = S.slideIdx === n - 1;

    const dots = $('slide-dots');
    dots.innerHTML = '';
    if (n <= 40) {
        S.slides.forEach((_, i) => {
            const d = document.createElement('button');
            d.className = 'slide-dot' + (i === S.slideIdx ? ' active' : '');
            d.title = t('slide.page', { n: i + 1 });
            d.onclick = () => { const dd = i > S.slideIdx ? 1 : -1; S.slideIdx = i; renderSlide(dd); };
            dots.appendChild(d);
        });
    }

    const card = $('slide-card');
    card.style.animation = 'none';
    void card.offsetHeight; // reflow
    card.style.animation = `${dir < 0 ? 'slideInBack' : 'slideIn'} 0.35s var(--ease-spring)`;
    card.scrollTop = 0;
    await postProcess(el);
}

let cmdIdx = 0;

function initCmdPalette() {
    const input = $('cmd-input');
    input.addEventListener('input', filterCmds);
    input.addEventListener('keydown', e => {
        const items = $('cmd-list').querySelectorAll('.cmd-item');
        if (e.key === 'ArrowDown') { e.preventDefault(); cmdIdx = Math.min(cmdIdx + 1, items.length - 1); updateCmdSel(items); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); cmdIdx = Math.max(cmdIdx - 1, 0); updateCmdSel(items); }
        else if (e.key === 'Enter') { e.preventDefault(); if (items[cmdIdx]) items[cmdIdx].click(); }
        else if (e.key === 'Escape') { e.preventDefault(); closeCmdPalette(); }
    });
}

function openCmdPalette() {
    const o = $('cmd-overlay');
    o.classList.add('open');
    $('cmd-input').value = '';
    filterCmds();
    setTimeout(() => $('cmd-input').focus(), 30);
}

function closeCmdPalette() {
    const o = $('cmd-overlay');
    if (!o.classList.contains('open')) return;
    o.classList.remove('open');
    $('editor').focus();
}

function filterCmds() {
    const q = $('cmd-input').value.trim().toLowerCase();
    const list = $('cmd-list');
    list.innerHTML = '';
    cmdIdx = 0;
    const filtered = COMMANDS.filter(c => !q || c.en.toLowerCase().includes(q) || c.zh.toLowerCase().includes(q) || (c.shortcut || '').toLowerCase().includes(q));
    if (!filtered.length) { list.innerHTML = `<div class="cmd-empty">${esc(t('cmd.empty'))}</div>`; return; }
    filtered.forEach((c, i) => {
        const primary = LANG === 'zh' ? c.zh : c.en, secondary = LANG === 'zh' ? c.en : c.zh;
        const div = document.createElement('div');
        div.className = 'cmd-item' + (i === 0 ? ' selected' : '');
        div.innerHTML = `<span class="cmd-ico">${c.icon}</span><span>${esc(primary)}<span class="cmd-en"> ${esc(secondary)}</span></span>${c.shortcut ? `<span class="cmd-shortcut">${esc(shortcutLabel(c.shortcut))}</span>` : ''}`;
        div.onclick = () => { closeCmdPalette(); setTimeout(c.fn, 60); };
        div.onmousemove = () => { if (cmdIdx !== i) { cmdIdx = i; updateCmdSel(list.querySelectorAll('.cmd-item')); } };
        list.appendChild(div);
    });
}

function updateCmdSel(items) {
    items.forEach((it, i) => it.classList.toggle('selected', i === cmdIdx));
    if (items[cmdIdx]) items[cmdIdx].scrollIntoView({ block: 'nearest' });
}

function shortcutLabel(sc) { return IS_MAC ? sc.replace(/Ctrl/g, '⌘') : sc; }
function initShortcutLabels() {
    document.querySelectorAll('[data-sc]').forEach(el => el.textContent = shortcutLabel(el.dataset.sc));
    document.querySelectorAll('[data-kbd]').forEach(el => el.textContent = shortcutLabel(el.dataset.kbd));
}

// ===== Theme =====
function applyThemeUI(theme) {
    $('ico-sun').style.display = theme === 'dark' ? 'block' : 'none';
    $('ico-moon').style.display = theme === 'light' ? 'block' : 'none';
    $('hljs-dark').disabled = theme !== 'dark';
    $('hljs-light').disabled = theme !== 'light';
    $('sb-theme').textContent = theme === 'dark' ? t('sb.dark') : t('sb.light');
}

function toggleTheme() {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    applyThemeUI(next);
    initMermaid();
    try { mvStore.set('markvue-theme', next); } catch (e) {}
    render();
}

// Follow the OS theme while the user has not picked one explicitly.
try {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    mq.addEventListener('change', ev => {
        let saved = null;
        try { saved = mvStore.get('markvue-theme'); } catch (e) {}
        if (saved) return;
        const next = ev.matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        applyThemeUI(next); initMermaid(); render();
    });
} catch (e) {}

// ===== View =====
function setView(mode) {
    S.view = mode;
    const m = $('main');
    m.classList.remove('editor-only', 'preview-only');
    if (mode !== 'split') m.classList.add(mode);
    document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === mode));
